# Render Blueprint. New + > Blueprint, point it at your repo, and it reads this.
services:
  - type: web
    name: bug-fixing-team
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: GOOGLE_API_KEY
        sync: false              # you type these in the dashboard, once
      - key: DAYTONA_API_KEY
        sync: false
